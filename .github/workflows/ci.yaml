name: CI

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        env:
            NUXT_PUBLIC_SITE_URL: http://localhost:3000

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Set up npm
              run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Generate Nuxt types
              run: npm run prepare:nuxt

            - name: Lint
              if: ${{ !cancelled() }}
              run: npm run lint:ox

            - name: Format
              if: ${{ !cancelled() }}
              run: npm run format:ox:check

            - name: Typecheck
              if: ${{ !cancelled() }}
              run: npm run typecheck

            - name: Knip
              if: ${{ !cancelled() }}
              run: npm run knip

            - name: Build
              if: ${{ !cancelled() }}
              run: npm run build
